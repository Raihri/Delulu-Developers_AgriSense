[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agrisense-ai"
version = "0.1.0"
description = "Source-grounded Bangladesh dry-season farm planning demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "supabase>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ingest = ["pdfplumber>=0.11,<1", "pypdf>=5,<7"]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools]
py-modules = ["app", "config", "db", "postgres"]

[tool.setuptools.packages.find]
include = ["agent*", "intake*", "kb*", "state*", "tools*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
